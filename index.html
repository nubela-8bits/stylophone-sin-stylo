<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <!--conexion con css-->
    <link rel="stylesheet" href="style.css">
    
    <title>Stylophone Virtual</title>
  </head>
  
  <body>
   
    <h1>stylophone sin stylo :(</h1>

    <div class="teclas">
      <!--botones asociados a la clase "tecla" y sus datos "note"-->
      <button class="tecla" data-note="C3">C3</button>
      <button class="tecla" data-note="C#3">C#3</button>
      <button class="tecla" data-note="D3">D3</button>
      <button class="tecla" data-note="D#3">D#3</button>
      <button class="tecla" data-note="E3">E3</button>
      <button class="tecla" data-note="F3">F3</button>
      <button class="tecla" data-note="F#3">F#3</button>
      <button class="tecla" data-note="G3">G3</button>
      <button class="tecla" data-note="G#3">G#3</button>
      <button class="tecla" data-note="A3">A3</button>
      <button class="tecla" data-note="A#3">A#3</button>
      <button class="tecla" data-note="B3">B3</button>
      <button class="tecla" data-note="C4">C4</button>
    </div>
    
    <!--conexion con java script-->
    <script src="script.js"></script>
  </body>
</html>
